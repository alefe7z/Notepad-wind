name: Gerar .exe

on:
  push:
    branches: ["**"]
    paths:
      - "notepad.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Gerar BlocoDeNotas.exe
        run: pyinstaller --noconfirm --onefile --windowed --name BlocoDeNotas notepad.py

      - uses: actions/upload-artifact@v4
        with:
          name: BlocoDeNotas
          path: dist/BlocoDeNotas.exe

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bloco de Notas (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Executável para Windows gerado automaticamente a partir de ${{ github.sha }}.
          files: dist/BlocoDeNotas.exe
